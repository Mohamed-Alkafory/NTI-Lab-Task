<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Get Products</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
        text-align: center;
      }

      #getDataBtn {
        padding: 12px 25px;
        font-size: 16px;
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 30px;
      }

      #getDataBtn:hover {
        background-color: #1a252f;
      }

      #cardsContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
      }

      .card {
        background: white;
        width: 220px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        padding: 15px;
        text-align: center;
      }

      .card img {
        width: 100%;
        height: 150px;
        object-fit: contain;
      }

      .card h3 {
        font-size: 14px;
        height: 40px;
        overflow: hidden;
      }

      .card p {
        color: #2c3e50;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Products</h1>

    <button id="getDataBtn">Get Data</button>

    <div id="cardsContainer"></div>

    <script src="script.js"></script>
  </body>
</html>
